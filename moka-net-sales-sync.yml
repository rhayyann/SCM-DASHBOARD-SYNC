name: Moka Net Sales Sync (Harian)

on:
  # Trigger utama: dipanggil oleh cron-job.org tiap hari jam 07:00 WITA
  # lewat GitHub API repository_dispatch. Lihat SETUP_MINGGUAN.md.
  repository_dispatch:
    types: [moka-daily-sync]

  # Trigger manual dari tab Actions -> pilih mode "daily" (testing) atau
  # "backfill" (isi histori per rentang tanggal, bisa dipecah beberapa run
  # kalau rentangnya panjang -- lihat catatan di backfill_start/backfill_end).
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode sinkronisasi'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - backfill
      backfill_start:
        description: 'Backfill mulai tanggal (format YYYY-MM-DD). Kosongkan = otomatis 2026-01-01.'
        required: false
        type: string
      backfill_end:
        description: 'Backfill sampai tanggal (format YYYY-MM-DD). Kosongkan = otomatis kemarin. Untuk rentang panjang (>3 bulan), disarankan dipecah jadi beberapa run terpisah.'
        required: false
        type: string

  # Jadwal cadangan kalau-kalau cron-job.org gagal trigger.
  # 23:00 UTC = 07:00 WITA (Asia/Makassar, UTC+8) keesokan harinya.
  schedule:
    - cron: '0 23 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    # Backfill harian (bukan mingguan lagi) berarti jauh lebih banyak
    # panggilan API per outlet -> timeout dinaikkan dari 15 ke 60 menit.
    # Fetch sudah dijalankan paralel (lihat MOKA_FETCH_WORKERS di script),
    # tapi kalau backfill-nya sangat panjang (banyak bulan sekaligus),
    # tetap disarankan dipecah jadi beberapa run manual.
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Moka Net Sales sync
        env:
          MOKA_CLIENT_ID: ${{ secrets.MOKA_CLIENT_ID }}
          MOKA_CLIENT_SECRET: ${{ secrets.MOKA_CLIENT_SECRET }}
          MOKA_OUTLET_MAP: ${{ secrets.MOKA_OUTLET_MAP }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          MOKA_SYNC_MODE: ${{ github.event.inputs.mode || 'daily' }}
          MOKA_BACKFILL_START: ${{ github.event.inputs.backfill_start || '' }}
          MOKA_BACKFILL_END: ${{ github.event.inputs.backfill_end || '' }}
          MOKA_FETCH_WORKERS: '6'
        run: python moka_sheets_sync.py
