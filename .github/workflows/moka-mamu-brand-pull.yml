name: Moka MAMU Brand Pull (One-Time, Semua Store)

on:
  # Sengaja HANYA workflow_dispatch -- ini pull historis sekali-jalan
  # (bisa diulang kapan saja untuk refresh), BUKAN cron rutin. Tidak ada
  # 'schedule' atau 'repository_dispatch' di sini supaya tidak bentrok
  # dengan sync harian yang sudah ada (moka-net-sales-sync.yml) dan tidak
  # menyentuh tab/spreadsheet dashboard utama sama sekali.
  workflow_dispatch:
    inputs:
      target_sheet_id:
        description: 'Sheet ID spreadsheet TUJUAN rekap MAMU (BUKAN dashboard utama) -- ambil dari URL spreadsheet, dan pastikan sudah di-share ke email service account sebagai Editor'
        required: true
        type: string
      start:
        description: 'Bulan mulai (format YYYY-MM) -- default awal pencatatan'
        required: false
        default: '2021-01'
        type: string
      end:
        description: 'Bulan akhir (format YYYY-MM). Kosongkan = bulan berjalan.'
        required: false
        type: string
      brand_filter:
        description: 'Kata kunci brand yang dicari di CATEGORY/nama item (case-insensitive)'
        required: false
        default: 'MAMU'
        type: string

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MAMU brand pull
        env:
          MOKA_CLIENT_ID: ${{ secrets.MOKA_CLIENT_ID }}
          MOKA_CLIENT_SECRET: ${{ secrets.MOKA_CLIENT_SECRET }}
          MOKA_OUTLET_MAP: ${{ secrets.MOKA_OUTLET_MAP }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          MOKA_MAMU_TARGET_SHEET: ${{ github.event.inputs.target_sheet_id }}
          MOKA_MAMU_START: ${{ github.event.inputs.start }}
          MOKA_MAMU_END: ${{ github.event.inputs.end }}
          MOKA_MAMU_BRAND_FILTER: ${{ github.event.inputs.brand_filter }}
        run: python moka_mamu_brand_pull.py
