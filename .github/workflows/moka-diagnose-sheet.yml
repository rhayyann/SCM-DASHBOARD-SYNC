name: Moka Diagnose Sheet ID (Read-Only, Sekali Pakai)

on:
  # Manual only. Read-only -- tidak menulis apapun. Aman dijalankan kapan
  # saja untuk cek spreadsheet mana yang ditunjuk GOOGLE_SHEET_ID.
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnose GOOGLE_SHEET_ID
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python moka_diagnose_sheet.py
